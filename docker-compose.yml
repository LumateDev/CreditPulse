services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creditpulse-backend
    env_file:
      - path: .env
        required: true
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditpulse-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:80"
    restart: unless-stopped
